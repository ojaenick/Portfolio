<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olga Jaenick — UX / UI &amp; Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ===================== GATE ===================== -->
<section id="gate" class="gate">
  <div class="gate-bubbles" id="gateBubbles" aria-hidden="true"></div>
  <div class="gate-top">
    <div class="gate-lang" id="gateLang">
      <button type="button" data-lang="en">EN</button><span class="sep">/</span><button type="button" data-lang="de">DE</button>
    </div>
  </div>
  <div class="gate-card">
    <div class="gate-logo" id="gateLogo"></div>
    <h1 class="gate-line" id="gateLine"></h1>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <input id="gatePw" type="password" autocomplete="off" />
      <button type="submit" id="gateBtn"></button>
    </form>
    <div class="gate-err" id="gateErr"></div>
  </div>
  <div class="gate-scrollhint" id="gateHint"></div>
</section>

<!-- ===================== SITE ===================== -->
<div id="site" hidden>
  <div class="yearbg" id="yearbg" aria-hidden="true"></div>
  <header class="topbar" id="topbar">
    <button class="brand" id="brand" aria-label="Top"></button>
    <div class="lang" id="lang">
      <button type="button" data-lang="en">EN</button><span class="sep">/</span><button type="button" data-lang="de">DE</button>
    </div>
  </header>

  <main class="timeline" id="timeline"></main>

  <nav class="dots" id="dots" aria-label="Timeline navigation"></nav>
  <button class="fab" id="fab" aria-label="Contact"></button>
</div>

<!-- ===================== OVERLAY ===================== -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-bg" id="overlayBg"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script src="app.js"></script>
</body>
</html>
